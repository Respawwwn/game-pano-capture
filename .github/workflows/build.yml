name: Build and Release

on:
  push:
    tags:
      - '*'  # Trigger on any version tags (1.0.0, 1.2.3, etc.)

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            executable: pano-capture
          - os: windows-latest
            platform: windows
            executable: pano-capture.exe
          - os: macos-latest
            platform: macos
            executable: pano-capture

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Get tag name
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
        else
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Update version in spec file
      run: |
        python -c "
        import re
        with open('pano-capture.spec', 'r') as f:
            content = f.read()

        # Update the name to include version and platform
        tag = '${{ steps.tag.outputs.tag }}'
        platform = '${{ matrix.platform }}'
        new_name = f'pano-capture-{tag}-{platform}'

        content = re.sub(r\"name='pano-capture'\", f\"name='{new_name}'\", content)

        with open('pano-capture.spec', 'w') as f:
            f.write(content)
        "

    - name: Build executable
      run: |
        python build.py

    - name: Verify executable was created
      run: |
        ls -la dist/

    - name: Create latest version copies
      run: |
        tag="${{ steps.tag.outputs.tag }}"
        platform="${{ matrix.platform }}"

        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          # Windows executable
          cp "dist/pano-capture-${tag}-${platform}.exe" "dist/pano-capture-latest-${platform}.exe"
        else
          # Linux/macOS executable
          cp "dist/pano-capture-${tag}-${platform}" "dist/pano-capture-latest-${platform}"
        fi

        echo "Created latest version:"
        ls -la dist/pano-capture-latest-*
      shell: bash

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: pano-capture-${{ steps.tag.outputs.tag }}-${{ matrix.platform }}
        path: |
          dist/pano-capture-*
        retention-days: 5

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get tag name
      id: tag
      run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: artifacts

    - name: Display structure of downloaded files
      run: ls -la artifacts/

    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ steps.tag.outputs.tag }}
        tag_name: ${{ steps.tag.outputs.tag }}
        body: |
          ## Game Pano Capture ${{ steps.tag.outputs.tag }}

          Standalone executables for multiple platforms.

          ### Downloads

          **Latest versions (recommended):**
          - **Windows**: `pano-capture-latest-windows.exe`
          - **macOS**: `pano-capture-latest-macos`
          - **Linux**: `pano-capture-latest-linux`

          **Versioned releases:**
          - **Windows**: `pano-capture-${{ steps.tag.outputs.tag }}-windows.exe`
          - **macOS**: `pano-capture-${{ steps.tag.outputs.tag }}-macos`
          - **Linux**: `pano-capture-${{ steps.tag.outputs.tag }}-linux`

          ### Quick Start
          ```bash
          # Download for your platform, then:

          # Make executable (Linux/macOS)
          chmod +x pano-capture-latest-macos

          # Run
          ./pano-capture-latest-macos --help

          # Windows
          pano-capture-latest-windows.exe --help
          ```
        files: |
          artifacts/*/pano-capture-*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
