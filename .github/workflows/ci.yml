name: CI

on:
  push:

jobs:
  ruff-linter:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Lint with Ruff
      run: |
        ruff check --output-format=github .

  ruff-formatter:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Check formatting with Ruff
      run: |
        ruff format --check .

  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.13']
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      timeout-minutes: 1
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Unit tests
      run: |
        pytest -m "unit" --verbose

    - name: Run Functional tests
      run: |
        pytest -m "functional" --verbose

    - name: Run platform-specific tests (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pytest -m "linux" --verbose

    - name: Run platform-specific tests (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pytest -m "windows" --verbose

    - name: Run platform-specific tests (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        pytest -m "macos" --verbose

  test-build:
    name: Test Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Test build process
      run: |
        python build.py

    - name: Test executable
      run: |
        # Run the appropriate executable
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          output=$(./dist/pano-capture.exe --help)
          usage_pattern="usage: pano-capture.exe"
          platform="Windows"
        else
          output=$(./dist/pano-capture --help)
          usage_pattern="usage: pano-capture"
          platform="Unix"
        fi

        # Display output and verify common patterns
        echo "$output"
        echo "$output" | grep -q "$usage_pattern" || (echo "ERROR: $platform usage line not found" && exit 1)
        echo "$output" | grep -q "Game Screenshot Automation" || (echo "ERROR: Description not found" && exit 1)
        echo "$output" | grep -q "\-\-setup SETUP" || (echo "ERROR: --setup option not found" && exit 1)
        echo "$output" | grep -q "\-\-capture CAPTURE" || (echo "ERROR: --capture option not found" && exit 1)
        echo "✓ $platform executable help output verified"
      shell: bash
