name: CI

on:
  push:

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  ruff-linter:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Lint with Ruff
      run: |
        ruff check --output-format=github .

  ruff-formatter:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Check formatting with Ruff
      run: |
        ruff format --check .

  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.13']
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      timeout-minutes: 1
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Unit tests
      run: |
        pytest -m "unit" --verbose

    - name: Run Functional tests
      run: |
        pytest -m "functional" --verbose

    - name: Run platform-specific tests (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pytest -m "linux" --verbose

    - name: Run platform-specific tests (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pytest -m "windows" --verbose

    - name: Run platform-specific tests (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        pytest -m "macos" --verbose

  test-build:
    name: Test Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install ViGEmBus driver (Windows only)
      if: matrix.os == 'windows-latest'
      timeout-minutes: 5
      run: |
        try {
          # Download ViGEmBus driver
          $url = "https://github.com/nefarius/ViGEmBus/releases/latest/download/ViGEmBus_1.22.0_x64_x86_arm64.exe"
          $output = "ViGEmBus.exe"
          Write-Output "Downloading ViGEmBus driver..."
          Invoke-WebRequest -Uri $url -OutFile $output -TimeoutSec 30

          # Try silent installation with timeout
          Write-Output "Attempting silent installation..."
          $process = Start-Process -FilePath $output -ArgumentList "/SILENT", "/NORESTART" -PassThru -NoNewWindow
          $process | Wait-Process -Timeout 120 -ErrorAction SilentlyContinue

          if (!$process.HasExited) {
            Write-Output "Installation process timed out, killing it..."
            $process | Stop-Process -Force
          }

          Write-Output "ViGEmBus driver installation attempted (may require manual verification)"
        } catch {
          Write-Output "ViGEmBus installation failed: $($_.Exception.Message)"
          Write-Output "Continuing build without ViGEmBus driver..."
        }
      shell: powershell

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Test build process
      run: |
        python build.py

    - name: Test executable
      run: |
        # Run the appropriate executable
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          output=$(./dist/pano-capture.exe --help)
          usage_pattern="usage: pano-capture.exe"
          platform="Windows"
        else
          output=$(./dist/pano-capture --help)
          usage_pattern="usage: pano-capture"
          platform="Unix"
        fi

        # Display output and verify common patterns
        echo "$output"
        echo "$output" | grep -q "$usage_pattern" || (echo "ERROR: $platform usage line not found" && exit 1)
        echo "$output" | grep -q "Game Screenshot Automation" || (echo "ERROR: Description not found" && exit 1)
        echo "$output" | grep -q "\-\-setup SETUP" || (echo "ERROR: --setup option not found" && exit 1)
        echo "$output" | grep -q "\-\-capture CAPTURE" || (echo "ERROR: --capture option not found" && exit 1)
        echo "✓ $platform executable help output verified"
      shell: bash

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [ruff-linter, ruff-formatter, tests, test-build]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            executable: pano-capture
          - os: windows-latest
            platform: windows
            executable: pano-capture.exe
          - os: macos-latest
            platform: macos
            executable: pano-capture

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Get version identifier
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          # For branch builds, use commit SHA
          echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Install ViGEmBus driver (Windows only)
      if: matrix.os == 'windows-latest'
      timeout-minutes: 5
      run: |
        try {
          # Download ViGEmBus driver
          $url = "https://github.com/nefarius/ViGEmBus/releases/latest/download/ViGEmBus_1.22.0_x64_x86_arm64.exe"
          $output = "ViGEmBus.exe"
          Write-Output "Downloading ViGEmBus driver..."
          Invoke-WebRequest -Uri $url -OutFile $output -TimeoutSec 30

          # Try silent installation with timeout
          Write-Output "Attempting silent installation..."
          $process = Start-Process -FilePath $output -ArgumentList "/SILENT", "/NORESTART" -PassThru -NoNewWindow
          $process | Wait-Process -Timeout 120 -ErrorAction SilentlyContinue

          if (!$process.HasExited) {
            Write-Output "Installation process timed out, killing it..."
            $process | Stop-Process -Force
          }

          Write-Output "ViGEmBus driver installation attempted (may require manual verification)"
        } catch {
          Write-Output "ViGEmBus installation failed: $($_.Exception.Message)"
          Write-Output "Continuing build without ViGEmBus driver..."
        }
      shell: powershell

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable
      run: |
        python build.py

    - name: Verify executable was created
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          dir dist
        else
          ls -la dist/
        fi
      shell: bash

    - name: Create versioned copies
      run: |
        tag="${{ steps.tag.outputs.tag }}"
        platform="${{ matrix.platform }}"

        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          # Windows executable
          cp "dist/pano-capture.exe" "dist/pano-capture-${tag}-${platform}.exe"
        else
          # Linux/macOS executable
          cp "dist/pano-capture" "dist/pano-capture-${tag}-${platform}"
        fi

        echo "Created versions:"
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          dir dist
        else
          ls -la dist
        fi
      shell: bash

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pano-capture-${{ steps.tag.outputs.tag }}-${{ matrix.platform }}
        path: |
          dist/pano-capture-*
        retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get tag name
      id: tag
      run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: artifacts

    - name: Display structure of downloaded files
      run: ls -la artifacts/

    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ steps.tag.outputs.tag }}
        tag_name: ${{ steps.tag.outputs.tag }}
        body: |
          ## Game Pano Capture ${{ steps.tag.outputs.tag }}

          Standalone executables for multiple platforms.

          ### Downloads
          **Versioned releases:**
          - **Windows**: `pano-capture-${{ steps.tag.outputs.tag }}-windows.exe`
          - **macOS**: `pano-capture-${{ steps.tag.outputs.tag }}-macos`
          - **Linux**: `pano-capture-${{ steps.tag.outputs.tag }}-linux`

          ### Quick Start
          ```bash
          # Download for your platform, then:

          # Make executable (Linux/macOS)
          chmod +x pano-capture-[VERSION]-macos

          # Run
          ./pano-capture-[VERSION]-macos --help

          # Windows
          pano-capture-[VERSION]-windows.exe --help
          ```
        files: |
          artifacts/*/pano-capture-*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
