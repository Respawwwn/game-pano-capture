name: CI

on:
  push:

jobs:
  ruff-linter:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Lint with Ruff
      run: |
        ruff check --output-format=github .

  ruff-formatter:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Check formatting with Ruff
      run: |
        ruff format --check .

  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.13']
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      timeout-minutes: 1
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests
      run: |
        pytest -m "unit" --verbose

    - name: Run platform-specific tests (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pytest -m "linux" --verbose

    - name: Run platform-specific tests (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pytest -m "windows" --verbose

    - name: Run platform-specific tests (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        pytest -m "macos" --verbose
